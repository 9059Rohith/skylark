[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skylark-signal"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.12.3",
    "rapidfuzz==3.14.5",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
